<!doctype html><html lang="en"><head><meta charset="utf-8"><title>R7 — The silent end card</title><link rel="stylesheet" href="cards.css"></head>
<body><div class="wrap"><div class="card centre">
<div class="big">Anything that expires<br>goes on a silent last card.</div>
<p>A date. A place. A price. <b>An address.</b></p>
<p class="dim">Its script is one lone break. When the details change, the editor cuts it off and nothing else moves.</p>
</div></div></body></html>
